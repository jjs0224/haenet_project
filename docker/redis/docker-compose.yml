services:
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  # 1) Chroma 인덱스 빌더(1회 실행 후 종료)
  index_builder:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    container_name: app_index_builder
    restart: "no"
    depends_on:
      - redis
    environment:
      - CHROMA_DIR=/app/AI/menu_assistant/data/chroma
      - DATASET_PATH=/app/AI/menu_assistant/data/datasets/raw/menu_seed.json
      - COLLECTION=menu_index
      - EMBED_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    volumes:
      - chroma_data:/app/AI/menu_assistant/data/chroma
    user: "0:0"
    command: >
      bash -lc "
        set -e;
        mkdir -p $${CHROMA_DIR};
        chown -R 10001:10001 $${CHROMA_DIR};

        python /app/AI/menu_assistant/worker/scripts/build_chroma_index.py \
          --dataset $${DATASET_PATH} \
          --chroma_dir $${CHROMA_DIR} \
          --collection $${COLLECTION} \
          --embed_model $${EMBED_MODEL}
      "

  # 2) Worker - Menu Assistant
  worker_menu_assistant:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    container_name: app_worker_menu_assistant
    restart: unless-stopped
    depends_on:
      - redis
      - index_builder
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_NAME=cicdex:jobs:menu_assistant
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - chroma_data:/app/AI/menu_assistant/data/chroma
    command: ["python", "-m", "AI.menu_assistant.worker.worker_app.main"]

  # 3) Worker - Review OCR
  worker_review:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    container_name: app_worker_review
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_NAME=cicdex:jobs:review
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
    command: ["python", "-m", "AI.review.worker.worker_app.main"]

  # 4) Worker - Journal / Community
  worker_journal:
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    container_name: app_worker_journal
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_NAME=cicdex:jobs:journal
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # community는 DB/S3 접근이 필요하니 로컬 테스트 시엔 DB/S3 env도 추가 필요
    command: ["python", "-m", "AI.journal.worker.worker_app.main"]

volumes:
  redis_data:
  chroma_data:


