[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projecta-backend"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.11"

dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pymysql",
  "cryptography",
  "sqlalchemy",
  "alembic",
]
