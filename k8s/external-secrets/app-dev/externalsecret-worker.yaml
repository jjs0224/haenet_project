apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worker-secrets
  namespace: app-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: worker-secrets
    creationPolicy: Owner
  data:
    # DB secrets are intentionally excluded in dev (local .env)
    # App secrets from app/dev
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: app/dev
        property: GEMINI_API_KEY
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: app/dev
        property: JWT_SECRET_KEY
    - secretKey: NAVER_CLIENT_SECRET
      remoteRef:
        key: app/dev
        property: NAVER_CLIENT_SECRET
