apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: worker-secrets
    namespace: app-prod
spec:
    refreshInterval: 1h
    secretStoreRef:
        name: aws-secretsmanager
        kind: ClusterSecretStore
    target:
        name: worker-secrets
        creationPolicy: Owner
    data:
        # DB password from RDS-managed secret
        - secretKey: DB_PASSWORD
          remoteRef:
              key: rds!db-7526df75-2584-460e-9c4e-dc52f05cd601
              property: password
        # App secrets from app/prod
        - secretKey: JWT_SECRET_KEY
          remoteRef:
              key: app/prod
              property: JWT_SECRET_KEY
        - secretKey: GEMINI_API_KEY
          remoteRef:
              key: app/prod
              property: GEMINI_API_KEY
        - secretKey: NAVER_CLIENT_ID
          remoteRef:
              key: app/prod
              property: NAVER_CLIENT_ID
        - secretKey: NAVER_CLIENT_SECRET
          remoteRef:
              key: app/prod
              property: NAVER_CLIENT_SECRET
