apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-prod-secrets
  namespace: app-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: api-prod-secrets
    creationPolicy: Owner
  data:
    # DB host/port/name from app/prod/db
    - secretKey: DB_HOST
      remoteRef:
        key: app/prod/db
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: app/prod/db
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: app/prod/db
        property: DB_NAME
    # DB user/password from RDS-managed secret
    - secretKey: DB_USER
      remoteRef:
        key: rds!db-7526df75-2584-460e-9c4e-dc52f05cd601
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: rds!db-7526df75-2584-460e-9c4e-dc52f05cd601
        property: password
    # App secrets from app/prod
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: app/prod
        property: JWT_SECRET_KEY
    - secretKey: NAVER_CLIENT_SECRET
      remoteRef:
        key: app/prod
        property: NAVER_CLIENT_SECRET
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: app/prod
        property: GEMINI_API_KEY
    - secretKey: NAVER_CLIENT_ID
      remoteRef:
        key: app/prod
        property: NAVER_CLIENT_ID
    - secretKey: S3_BUCKET
      remoteRef:
        key: app/prod/db
        property: S3_BUCKET
    - secretKey: S3_REGION
      remoteRef:
        key: app/prod/db
        property: S3_REGION
    - secretKey: S3_PREFIX_TMP
      remoteRef:
        key: app/prod/db
        property: S3_PREFIX_TMP
    - secretKey: S3_PREFIX_PERM
      remoteRef:
        key: app/prod/db
        property: S3_PREFIX_PERM
