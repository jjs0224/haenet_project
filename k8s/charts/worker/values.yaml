replicaCount: 1

image:
    repository: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-worker-gpu
    tag: dev-003
    pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
    create: true
    name: ""
    annotations: {}

podAnnotations: {}
podLabels: {}

# Worker는 보통 Service/Ingress가 필요 없습니다.
service:
    enabled: false

# Worker 프로세스 실행 커맨드(프로젝트마다 다르므로 values로 분리)
# 예시:
# - RQ: ["rq"] + ["worker", "--url", "$(REDIS_URL)"]
# - Celery: ["celery"] + ["-A", "app.worker.celery_app", "worker", "-l", "INFO"]
worker:
    command: ["python"]
    args: ["-m", "AI.menu_assistant.worker.worker_app.main"]
    # 작업 처리 동시성 힌트(프레임워크에 따라 다름)
    concurrency: 1

env:
    APP_ENV: dev

queue:
    # dev: redis 권장, prod: sqs 등으로 확장 가능
    type: redis # redis | sqs
    redisUrl: "redis://redis-master:6379/0"
    name: "cicdex:jobs"
    processingName: "cicdex:jobs:processing"
    sqsQueueUrl: ""
    awsRegion: "ap-northeast-2"

# 앱 설정(비밀 아닌 것)
config:
    LOG_LEVEL: "INFO"
    # 예: S3 버킷/프리픽스 같은 비민감 값
    S3_BUCKET: ""
    S3_PREFIX: "upload/"
    S3_PREFIX_TMP: "tmp"
    S3_PREFIX_PERM: "perm"
    S3_REGION: ""
    MENU_ASSISTANT_CHROMA_S3_PREFIX: ""
    MENU_ASSISTANT_MENU_INDEX_S3_URI: ""

# 비밀 값(Secret로 생성 + /run/app-secrets 로 마운트)
secrets:
    enabled: false
    # 아래는 "문자열"로 넣지 말고, 실제로는 env values에서 넣거나
    # (운영) External Secrets로 대체하는 것을 권장
    GEMINI_API_KEY: ""
    DB_PASSWORD: ""
    JWT_SECRET_KEY: ""

# NOTE:
# - worker fullname includes release name by default (see templates/_helpers.tpl)
# - secretRefName controls the Secret used for envFrom (default: worker-secrets)

secretRefName: worker-secrets

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
