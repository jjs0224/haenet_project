 {{- if and .Values.secrets.enabled .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "worker.fullname" . }}-secrets
  labels:
    {{- include "worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | quote }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.JWT_SECRET_KEY | quote }}
                  {{- end }}
