replicaCount: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80


image:
  repository: ghcr.io/mingoo684/cicdex2-frontend
  tag: dev-001
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: app.local
  path: /
  pathType: Prefix

httpRoute:
  enabled: false


resources: {}
