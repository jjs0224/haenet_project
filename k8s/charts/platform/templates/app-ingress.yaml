{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  rules:
    {{- $apiHost := .Values.ingress.apiHost | default "" }}
    {{- $frontendHost := .Values.ingress.frontendHost | default .Values.host }}
    {{- if $apiHost }}
    - host: {{ $frontendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ default "frontend" .Values.frontendServiceName }}
                port:
                  number: 80
    - host: {{ $apiHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ default "api" .Values.apiServiceName }}
                port:
                  number: 8000
    {{- else }}
    - host: {{ default "app.local" .Values.host }}
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ default "api" .Values.apiServiceName }}
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ default "frontend" .Values.frontendServiceName }}
                port:
                  number: 80
    {{- end }}
{{- end }}
