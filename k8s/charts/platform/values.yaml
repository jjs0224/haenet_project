host: app.local
apiServiceName: api
frontendServiceName: frontend

ingress:
    enabled: true
    # Default: nginx path-based routing (legacy)
    className: nginx
    annotations:
        nginx.ingress.kubernetes.io/use-regex: "true"
        nginx.ingress.kubernetes.io/rewrite-target: /$2
    # If apiHost is set, chart switches to host-based routing:
    # - frontendHost -> frontend service ("/")
    # - apiHost -> api service ("/")
    frontendHost: ""
    apiHost: ""
