image:
    repository: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-worker-gpu
    tag: prod-001
    pullPolicy: IfNotPresent

imagePullSecrets: []

env:
    APP_ENV: dev

queue:
    type: redis
    redisUrl: redis://redis-master:6379/0
    name: "cicdex:jobs:menu_assistant"
    processingName: "cicdex:jobs:menu_assistant:processing"

config:
    LOG_LEVEL: INFO
    S3_BUCKET: dev-bucket-name
    S3_PREFIX: uploads/

secrets:
    enabled: false
    GEMINI_API_KEY: REPLACE_IN_DEV_ONLY
    DB_PASSWORD: REPLACE_IN_DEV_ONLY
    JWT_SECRET_KEY: REPLACE_IN_DEV_ONLY

autoscaling:
    enabled: false
