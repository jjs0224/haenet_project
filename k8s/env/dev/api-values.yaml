# k8s/env/dev/api-values.yaml

replicaCount: 1

image:
    repository: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-api
    tag: prod-001
    pullPolicy: IfNotPresent

# GHCR private/권한 이슈가 있으면 사용
imagePullSecrets: []

env:
    APP_ENV: dev
    STORAGE_BACKEND: local
    LOCAL_UPLOAD_ROOT: /app/uploads
    DB_HOST: project-prod-db.c7oeqq6c6a58.ap-northeast-2.rds.amazonaws.com
    DB_PORT: "3306"
    DB_NAME: app_db
    DB_USER: app_user
    REDIS_URL: "redis://redis-master:6379/0"
    QUEUE_NAME_MENU_ASSISTANT: "cicdex:jobs:menu_assistant"
    QUEUE_NAME_JOURNAL: "cicdex:jobs:journal"
    QUEUE_NAME_REVIEW: "cicdex:jobs:review"

# Secret을 "파일 마운트"로 주입하는 구조
secret:
    enabled: false
    dbPassword: DEV_DB_PASSWORD_CHANGE_ME
    jwtSecretKey: DEV_JWT_CHANGE_ME

probes:
    readinessPath: /health
    livenessPath: /health

resources: {}
    # 필요 시 아래처럼
    # requests:
    #   cpu: "100m"
    #   memory: "256Mi"
    # limits:
    #   cpu: "500m"
    #   memory: "512Mi"

ingress:
    enabled: true
    className: nginx
    host: app.local
    path: /api
