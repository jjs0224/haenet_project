image:
    repository: 624280434939.dkr.ecr.ap-northeast-2.amazonaws.com/projecta-worker
    tag: dev-001
    pullPolicy: IfNotPresent

env:
    APP_ENV: prod

queue:
    type: redis
    redisUrl: redis://:PROD_REDIS_PASSWORD_CHANGE_ME@redis-master.app-prod.svc.cluster.local:6379/0
    name: "cicdex:jobs:menu_assistant"
    processingName: "cicdex:jobs:menu_assistant:processing"
config:
    LOG_LEVEL: INFO
    S3_BUCKET: prod-bucket-name
    S3_PREFIX: uploads/

secrets:
    enabled: true
    OPENAI_API_KEY: PROD_OPENAI_API_KEY_CHANGE_ME
    DB_PASSWORD: PROD_DB_PASSWORD_CHANGE_ME
    JWT_SECRET_KEY: PROD_JWT_CHANGE_ME

secretMount:
    enabled: true
    mountPath: /run/app-secrets

autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
