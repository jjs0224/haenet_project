name: build-push-update-values

on:
    pull_request:
        paths-ignore:
            - "k8s/env/**"

    push:
        branches: ["main"]
        paths-ignore:
            - "k8s/env/**"

permissions:
    contents: write
    packages: write

env:
    AWS_REGION: ap-northeast-2
    REGISTRY: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com
    API_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-api
    FRONTEND_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-frontend
    WORKER_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-worker-gpu
    # 베이스 이미지 (requirements/dependencies가 변경되지 않으면 재사용)
    BACKEND_BASE_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-backend-base:latest
    WORKER_BASE_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-worker-base:latest
    FRONTEND_BASE_IMAGE: 690641653744.dkr.ecr.ap-northeast-2.amazonaws.com/haenet-frontend-base:latest

jobs:
    verify:
        name: verify (build only)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Set tag
              id: tag
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    echo "tag=pr-${{ github.event.pull_request.number }}-sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Pull backend base image
              run: docker pull ${{ env.BACKEND_BASE_IMAGE }} || echo "Base image not found, will use fallback build"

            - name: Build & Push (API)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/backend.Dockerfile
                  push: true
                  tags: |
                      ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
                  build-args: |
                      BASE_IMAGE=${{ env.BACKEND_BASE_IMAGE }}
                      REQUIREMENTS=requirements_api.txt
                  cache-from: type=gha,scope=backend-app
                  cache-to: type=gha,mode=max,scope=backend-app

            - name: Pull frontend base image
              run: docker pull ${{ env.FRONTEND_BASE_IMAGE }} || echo "Base image not found, will use fallback build"

            - name: Verify build (Worker)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/frontend.Dockerfile
                  push: true
                  tags: |
                      ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}
                  build-args: |
                      BASE_IMAGE=${{ env.FRONTEND_BASE_IMAGE }}
                      REACT_APP_API_BASE_URL=https://api.foodray.net
                  cache-from: type=gha,scope=frontend-app
                  cache-to: type=gha,mode=max,scope=frontend-app

            - name: Pull worker base image
              run: docker pull ${{ env.WORKER_BASE_IMAGE }} || echo "Base image not found, will use fallback build"

            - name: Verify build (Frontend)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/worker.Dockerfile
                  push: true
                  tags: |
                      ${{ env.WORKER_IMAGE }}:${{ steps.tag.outputs.tag }}
                  build-args: |
                      BASE_IMAGE=${{ env.WORKER_BASE_IMAGE }}
                      WORKER_REQUIREMENTS=requirements_cu.txt
                      PIP_EXTRA_INDEX_URL=https://download.pytorch.org/whl/cu126
                  cache-from: type=gha,scope=worker-app
                  cache-to: type=gha,mode=max,scope=worker-app

    build-push-and-bump-dev:
        name: build & push images, bump dev values
        runs-on: ubuntu-latest
        needs: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & Push (API api-final)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: backend/Dockerfile
                  target: api-final
                  push: true
                  tags: |
                      ${{ env.API_IMAGE }}:${{ env.TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build & Push (Worker runtime)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: backend/Dockerfile.worker
                  target: runtime
                  push: true
                  tags: |
                      ${{ env.WORKER_IMAGE }}:${{ env.TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build & Push (Frontend final)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: frontend/Dockerfile
                  target: final
                  push: true
                  tags: |
                      ${{ env.FRONTEND_IMAGE }}:${{ env.TAG }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update dev values tags (api/frontend/worker)
              run: |
                  python - <<'PY'
                  import pathlib, re

                  tag = "sha-${{ github.sha }}"
                  files = [
                    pathlib.Path("k8s/env/dev/api-values.yaml"),
                    pathlib.Path("k8s/env/dev/frontend-values.yaml"),
                    pathlib.Path("k8s/env/dev/worker-values.yaml"),
                  ]

                  for p in files:
                    if not p.exists():
                      raise SystemExit(f"values file not found: {p}")

                    s = p.read_text(encoding="utf-8")

                    # Replace the first encountered "tag:" line only
                    s2 = re.sub(r'(?m)^(\s*tag:\s*).*$',
                                r'\1"' + tag + r'"', s, count=1)

                    if s2 == s:
                      raise SystemExit(f"tag field not found to replace in {p}")

                    if "REPLACE_ME" in s2:
                      raise SystemExit(f"ERROR: REPLACE_ME still present after update in {p}")

                    p.write_text(s2, encoding="utf-8")
                    print("Updated:", p)
                  PY

            - name: Commit & push values update
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  git add k8s/env/dev/api-values.yaml k8s/env/dev/frontend-values.yaml k8s/env/dev/worker-values.yaml
                  git diff --cached --quiet && echo "No changes to commit" && exit 0

                  git commit -m "chore(dev): bump images to ${{ env.TAG }} [skip ci]"
                  git push
